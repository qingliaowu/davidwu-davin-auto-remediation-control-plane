[project]
name = "auto-remediation-control-plane"
version = "0.1.0"
description = "Event-driven control plane that converts approved GitHub issues into verified pull requests using Devin."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0,<0.150.0",
    "uvicorn[standard]>=0.30.0,<0.60.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "httpx>=0.27.0,<0.30.0",
    "pygithub>=2.3.0,<3.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.30.0",
    "ruff>=0.4.0,<0.10.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
